<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Detallado de Evidencias</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        .container-fluid {
            width: 95%; max-width: none; margin: 32px auto; background: var(--surface-card);
            padding: 32px 40px; border-radius: var(--border-radius); box-shadow: var(--box-shadow);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
        .dashboard-metrics {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px;
            margin-top: 32px; margin-bottom: 32px;
        }
        .metric-card {
            background-color: var(--surface-ground); padding: 24px; border-radius: var(--border-radius);
            text-align: center; border: 1px solid var(--surface-border-light);
        }
        .metric-card h3 {
            margin: 0 0 8px 0; font-size: 1em; color: var(--text-secondary); font-weight: 600;
        }
        .metric-card .count { font-size: 2.5em; font-weight: 700; }
        #report-table-container { overflow-x: auto; padding-bottom: 10px; }
        #report-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        #report-table th, #report-table td {
            padding: 10px 12px; text-align: left;
            border-bottom: 1px solid var(--surface-border-light);
            border-right: 1px solid var(--surface-border);
        }
        #report-table th:first-child, #report-table td:first-child {
             border-left: 1px solid var(--surface-border);
        }
        #report-table thead {
            position: sticky; top: 0; z-index: 10;
        }
        #report-table th {
            font-weight: 600; font-size: 0.85em; color: var(--text-secondary);
            background-color: var(--surface-ground);
            white-space: nowrap; vertical-align: middle; text-align: center;
        }
        #report-table .base-header { text-align: left; }
        #report-table .category-header {
            border-bottom: 2px solid var(--primary-color);
            font-size: 0.9em; color: var(--text-primary);
        }
        #report-table .subcategory-header {
            font-size: 0.8em; font-style: italic; background-color: #f8f9fa;
        }
        #report-table .category-general { background-color: #e6f7ff; }
        #report-table .category-entrada { background-color: #fffbe6; }
        #report-table .category-silabos { background-color: #f6ffed; }
        #report-table .category-unidad1 { background-color: #fff0f6; }
        #report-table .category-unidad2 { background-color: #fff7e6; }
        #report-table .category-unidad3 { background-color: #f9f0ff; }
        
        #report-table td { white-space: nowrap; }
        .status-cell { text-align: center; font-size: 1.2em; vertical-align: middle; }
        .status-cell a { text-decoration: none; }
        .status-tag {
            padding: 4px 10px; border-radius: 12px; font-weight: 600;
            font-size: 0.8em; display: inline-block;
        }
        .status-completado { background-color: var(--success-bg); color: var(--success-color); }
        .status-pendiente { background-color: var(--warning-bg); color: var(--warning-color); }
        .status-sin-registro { background-color: var(--danger-bg); color: var(--danger-color); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>Reporte Detallado de Evidencias</h1>
        <div class="form-section" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
            <div style="flex-grow: 1; min-width: 200px;">
                <label for="semester-selector">Seleccione el Semestre</label>
                <select id="semester-selector">
                    <option value="2025-2">2025-2</option>
                    <option value="2026-1">2026-1</option>
                </select>
            </div>
            <button id="load-report-btn" class="btn primary">Generar Reporte Detallado</button>
            <button id="export-btn" class="btn" style="display: none;">Exportar a Excel</button>
        </div>
        <div id="dashboard-loader" style="display: none; text-align: center; padding: 40px;">
            <div class="spinner" style="margin: 0 auto;"></div>
            <p id="loader-text" style="color: var(--text-secondary); margin-top: 16px;">Cargando...</p>
        </div>
        <div id="report-content" style="display: none;">
            <div class="dashboard-metrics">
                 <div class="metric-card"><h3>Total Cursos</h3><span id="total-count" class="count" style="color:var(--primary-color);">0</span></div>
                <div class="metric-card"><h3>Completados</h3><span id="completed-count" class="count" style="color: var(--success-color);">0</span></div>
                <div class="metric-card"><h3>Pendientes</h3><span id="pending-count" class="count" style="color: var(--warning-color);">0</span></div>
                <div class="metric-card"><h3>Sin Registro</h3><span id="unregistered-count" class="count" style="color: var(--danger-color);">0</span></div>
            </div>
            <hr>
            <div id="report-table-container">
                <h2>Detalle de Evidencias Obligatorias por Curso</h2>
                <table id="report-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="reportedetallado.js"></script>
</body>
</html>

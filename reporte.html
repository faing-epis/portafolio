<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Cumplimiento de Informes</title>
    
    <!-- Fuentes de Google (las mismas de tu app principal para consistencia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Reutilizamos la hoja de estilos de tu aplicación principal -->
    <link rel="stylesheet" href="style.css">

    <!-- Estilos específicos para el Reporte -->
    <style>
        .dashboard-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
            margin-top: 32px;
            margin-bottom: 32px;
        }
        .metric-card {
            background-color: var(--surface-ground);
            padding: 24px;
            border-radius: var(--border-radius);
            text-align: center;
            border: 1px solid var(--surface-border-light);
        }
        .metric-card h3 {
            margin: 0 0 8px 0;
            font-size: 1em;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-card .count {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--primary-color);
        }
        #report-table-container {
            overflow-x: auto;
        }
        #report-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        #report-table th, #report-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--surface-border-light);
        }
        #report-table th {
            font-weight: 600;
            font-size: 0.9em;
            color: var(--text-secondary);
        }
        .status-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8em;
            display: inline-block;
            text-align: center;
            min-width: 90px;
        }
        .status-completado {
            background-color: var(--success-bg);
            color: var(--success-color);
        }
        .status-pendiente {
            background-color: var(--warning-bg);
            color: var(--warning-color);
        }
        .status-sin-registro {
            background-color: var(--danger-bg);
            color: var(--danger-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Reporte de Cumplimiento</h1>
        
        <div class="form-section" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
            <div style="flex-grow: 1; min-width: 200px;">
                <label for="semester-selector">Seleccione el Semestre</label>
                <select id="semester-selector">
                    <option value="2025-2">2025-2</option>
                    <option value="2026-1">2026-1</option>
                    <!-- Agrega más semestres aquí si es necesario -->
                </select>
            </div>
            <div style="flex-grow: 1; min-width: 250px;">
                <label for="report-type-selector">Seleccione el Tipo de Informe</label>
                    <select id="report-type-selector">
                        <option value="entryTest">Informe de Prueba de Entrada</option>
                        <option value="portfolio_I">Portafolio por Unidad I</option>
                        <option value="portfolio_II">Portafolio por Unidad II</option>
                        <option value="portfolio_III">Portafolio por Unidad III</option>
                        <option value="finalReport">Informe Final de Curso</option> <!-- <-- AÑADIR ESTA LÍNEA -->
                        <option value="docPortfolio">Documentación de Portafolio (Evidencias)</option>
                    </select>
            </div>
            <button id="load-report-btn" class="btn primary">Generar Reporte</button>
        </div>

        <div id="dashboard-loader" style="display: none; text-align: center; padding: 40px;">
            <div class="spinner" style="margin: 0 auto;"></div>
            <p style="color: var(--text-secondary); margin-top: 16px;">Cargando datos del reporte...</p>
        </div>

        <div id="report-content" style="display: none;">
            <div class="dashboard-metrics">
                <div class="metric-card">
                    <h3>Total Cursos</h3>
                    <span id="total-count" class="count">0</span>
                </div>
                <div class="metric-card">
                    <h3>Completados</h3>
                    <span id="completed-count" class="count" style="color: var(--success-color);">0</span>
                </div>
                <div class="metric-card">
                    <h3>Pendientes</h3>
                    <span id="pending-count" class="count" style="color: var(--warning-color);">0</span>
                </div>
                <div class="metric-card">
                    <h3>Sin Registro</h3>
                    <span id="unregistered-count" class="count" style="color: var(--danger-color);">0</span>
                </div>
            </div>

            <hr>

            <div id="report-table-container">
                <h2>Detalle de Cursos Asignados</h2>
                <table id="report-table">
                    <thead>
                        <tr>
                            <th>Docente</th>
                            <th>Curso</th>
                            <th>Sección</th>
                            <th>Estado del Informe</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Las filas se generarán dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- El script que hará que todo funcione -->
    <script src="reporte.js"></script>
</body>
</html>
